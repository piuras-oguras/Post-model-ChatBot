services:
  post-model:
    build: .
    image: post-model
    ports:
      - "${POSTMODEL__PORT:-8011}:8011"
    env_file:
      - path: .env
        required: false
    environment:
      # Default guard-model URL points at the host's Ollama instance, not the container.
      POSTMODEL__GUARD_MODEL__BASE_URL: ${POSTMODEL__GUARD_MODEL__BASE_URL:-http://host.docker.internal:11434/v1}
      POSTMODEL__HOST: 0.0.0.0
      POSTMODEL__PORT: "8011"
    # Lets the container resolve host.docker.internal on Linux hosts too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
